<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradientes fiéis à identidade da flor de lótus Lothus -->
    <linearGradient id="petalDeep" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0E4A7D" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1863DC" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="petalMid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1A659E" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#3898B6" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="petalCyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2B82A8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#60B2CE" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="petalLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4EA0C2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#95D1E5" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <g transform="translate(250, 250)">
    <!-- Pétalas Externas da Flor de Lótus -->
    <g style="mix-blend-mode: multiply;">
      <!-- Camada 1: Cruz Principal -->
      <path d="M 0,-215 C -45,-140 -45,-30 0,0 C 45,-30 45,-140 0,-215 Z" fill="url(#petalDeep)"/>
      <path d="M 0,215 C -45,140 -45,30 0,0 C 45,30 45,140 0,215 Z" fill="url(#petalDeep)"/>
      <path d="M -215,0 C -140,-45 -30,-45 0,0 C -30,45 -140,45 -215,0 Z" fill="url(#petalDeep)"/>
      <path d="M 215,0 C 140,-45 30,-45 0,0 C 30,45 140,45 215,0 Z" fill="url(#petalDeep)"/>

      <!-- Camada 2: Rotação a 45 graus -->
      <g transform="rotate(45)">
        <path d="M 0,-200 C -42,-130 -42,-28 0,0 C 42,-28 42,-130 0,-200 Z" fill="url(#petalMid)"/>
        <path d="M 0,200 C -42,130 -42,28 0,0 C 42,28 42,130 0,200 Z" fill="url(#petalMid)"/>
        <path d="M -200,0 C -130,-42 -28,-42 0,0 C -28,42 -130,42 -200,0 Z" fill="url(#petalMid)"/>
        <path d="M 200,0 C 130,-42 28,-42 0,0 C 28,42 130,42 200,0 Z" fill="url(#petalMid)"/>
      </g>

      <!-- Camada 3: Rotações intermediárias de 22.5 e 67.5 graus -->
      <g transform="rotate(22.5)">
        <path d="M 0,-185 C -38,-120 -38,-25 0,0 C 38,-25 38,-120 0,-185 Z" fill="url(#petalCyan)"/>
        <path d="M 0,185 C -38,120 -38,25 0,0 C 38,25 38,120 0,185 Z" fill="url(#petalCyan)"/>
        <path d="M -185,0 C -120,-38 -25,-38 0,0 C -25,38 -120,38 -185,0 Z" fill="url(#petalCyan)"/>
        <path d="M 185,0 C 120,-38 25,-38 0,0 C 25,38 120,38 185,0 Z" fill="url(#petalCyan)"/>
      </g>
      <g transform="rotate(67.5)">
        <path d="M 0,-185 C -38,-120 -38,-25 0,0 C 38,-25 38,-120 0,-185 Z" fill="url(#petalLight)"/>
        <path d="M 0,185 C -38,120 -38,25 0,0 C 38,25 38,120 0,185 Z" fill="url(#petalLight)"/>
        <path d="M -185,0 C -120,-38 -25,-38 0,0 C -25,38 -120,38 -185,0 Z" fill="url(#petalLight)"/>
        <path d="M 185,0 C 120,-38 25,-38 0,0 C 25,38 120,38 185,0 Z" fill="url(#petalLight)"/>
      </g>
    </g>

    <!-- Barra central branca para acomodar a tipografia oficial da marca Lothus -->
    <rect x="-240" y="-52" width="480" height="104" fill="#FFFFFF" rx="4"/>
    <line x1="-235" y1="-52" x2="235" y2="-52" stroke="#106296" stroke-width="4" stroke-linecap="round"/>
    <line x1="-235" y1="52" x2="235" y2="52" stroke="#106296" stroke-width="4" stroke-linecap="round"/>

    <!-- Tipografia LOTHUS -->
    <text x="0" y="22" font-family="'Montserrat', 'Plus Jakarta Sans', sans-serif" font-size="82" font-weight="300" fill="#0E5284" letter-spacing="12" text-anchor="middle">LOTHUS</text>
    <!-- Subtítulo LIMPEZA | DESCARTÁVEIS | PAPELARIA -->
    <text x="0" y="44" font-family="'DM Sans', 'Inter', sans-serif" font-size="13.5" font-weight="600" fill="#475569" letter-spacing="4" text-anchor="middle">LIMPEZA | DESCARTÁVEIS | PAPELARIA</text>
  </g>
</svg>